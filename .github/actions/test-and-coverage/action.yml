name: Test & Coverage
description: Run tests with coverage collection and reporting

inputs:
  test-project:
    description: Test project pattern
    required: false
    default: 'test/**/*.Tests.csproj'
  configuration:
    description: Build configuration
    required: false
    default: Release
  verbosity:
    description: Test verbosity
    required: false
    default: minimal

runs:
  using: composite
  steps:
    - name: Test with coverage
      shell: bash
      run: |
        dotnet test ${{ inputs.test-project }} \
          --configuration ${{ inputs.configuration }} \
          --verbosity ${{ inputs.verbosity }} \
          --logger trx \
          --collect "XPlat Code Coverage;Format=cobertura" \
          --results-directory ./test-results

    - name: Upload test results
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ./test-results/**/*.trx
        if-no-files-found: warn

    - name: Upload coverage
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: ./test-results/**/coverage.cobertura.xml
        if-no-files-found: warn

    - name: Publish test results
      if: success() || failure()
      uses: dorny/test-reporter@v1
      with:
        name: Test Results
        path: ./test-results/**/*.trx
        reporter: dotnet-trx
        fail-on-error: false

    - name: Publish coverage summary
      if: success() || failure()
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: ./test-results/**/coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        output: both

    - name: Report tests
      if: success() || failure()
      shell: bash
      run: |
        {
          echo "## Test Execution"
          echo "| Metric | Status |"
          echo "| --- | --- |"
          echo "| Coverage Report | 📊 Published |"
          echo "| Test Reporter | ✅ Submitted |"
          echo "| Configuration | ${{ inputs.configuration }} |"
        } >> "$GITHUB_STEP_SUMMARY"
