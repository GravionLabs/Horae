name: DocFX Build
description: Build DocFX documentation and upload to Pages

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Build solution (for XML docs)
      shell: bash
      run: |
        dotnet restore Horae.slnx
        dotnet build Horae.slnx \
          --configuration Release \
          --no-restore

    - name: Install DocFX
      shell: bash
      run: dotnet tool install -g docfx

    - name: Build docs with DocFX
      shell: bash
      run: docfx docfx.json

    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: Report DocFX
      shell: bash
      run: |
        PAGES_COUNT=$(find _site -name "*.html" | wc -l)
        {
          echo "## Documentation Build"
          echo "| Metric | Value |"
          echo "| --- | --- |"
          echo "| DocFX Build | ✅ Success |"
          echo "| Pages Generated | $PAGES_COUNT |"
          echo "| Output | _site/ |"
          echo "| Deployment | 📦 Artifact uploaded |"
        } >> "$GITHUB_STEP_SUMMARY"
