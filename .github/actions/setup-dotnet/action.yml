name: Setup .NET
description: Setup .NET SDK and cache NuGet packages

inputs:
  dotnet-version:
    description: .NET version (e.g. 10.x)
    required: false
    default: '10.x'

outputs:
  cache-hit:
    description: Whether NuGet cache was hit
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Cache NuGet packages
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-packages-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/packages.lock.json') }}
        restore-keys: |
          nuget-packages-${{ runner.os }}-

    - name: Report setup
      shell: bash
      run: |
        {
          echo "## .NET Setup"
          echo "| Item | Status |"
          echo "| --- | --- |"
          echo "| .NET Version | $(dotnet --version) |"
          echo "| NuGet Cache | ${{ steps.cache.outputs.cache-hit == 'true' && '✅ Hit' || '⚠️ Miss' }} |"
        } >> "$GITHUB_STEP_SUMMARY"
