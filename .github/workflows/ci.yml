name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verbosity:
        description: 'dotnet build verbosity level'
        required: false
        default: 'minimal'
        type: choice
        options:
          - quiet
          - minimal
          - normal
          - detailed
          - diagnostic
      force-publish:
        description: 'Force package publication'
        required: false
        default: false
        type: boolean

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      nuget-version: ${{ steps.version.outputs.nuget-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@main
        with:
          gitversion-config-file: GitVersion.yml

  build-test-pack:
    name: Build, Test & Pack
    runs-on: ubuntu-latest
    needs: determine-version
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Build
        uses: GravionLabs/ci/dotnet/build@main
        with:
          dotnet-project: Horae.slnx
          verbosity: ${{ github.event.inputs.verbosity || 'minimal' }}

      - name: Test & Coverage
        uses: GravionLabs/ci/dotnet/test@main
        with:
          test-project: 'test/**/*.Tests.csproj'

      - name: Pack
        uses: GravionLabs/ci/dotnet/nuget/pack@main
        with:
          dotnet-project: Horae.slnx
          version: ${{ needs.determine-version.outputs.nuget-version }}

      - name: Verify package contents
        uses: GravionLabs/ci/dotnet/nuget/verify-package@main
        with:
          files: |
            lib/net8.0/Horae.dll
            lib/net9.0/Horae.dll
            lib/net10.0/Horae.dll
            lib/net8.0/Horae.xml
            lib/net9.0/Horae.xml
            lib/net10.0/Horae.xml
            README.md
            CHANGELOG.md

  publish:
    name: Publish
    needs: [determine-version, build-test-pack]
    if: github.ref == 'refs/heads/main' || github.event.inputs.force-publish == 'true'
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      packages: write
    steps:
      - name: Publish to GitHub Packages
        uses: GravionLabs/ci/dotnet/nuget/publish@main
        with:
          feed-url: 'https://nuget.pkg.github.com/GravionLabs/index.json'
          api-key: ${{ secrets.GITHUB_TOKEN }}
          download-artifact: 'true'

      - name: Publish to NuGet.org
        uses: GravionLabs/ci/dotnet/nuget/publish@main
        with:
          feed-url: 'https://api.nuget.org/v3/index.json'
          api-key: ${{ secrets.NUGET_API_KEY }}
          download-artifact: 'false'

  release:
    name: Release
    needs: [determine-version, publish]
    if: github.ref == 'refs/heads/main' || github.event.inputs.force-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: GravionLabs/ci/versioning/gh-release@main
        with:
          version: ${{ needs.determine-version.outputs.semver }}
          cliff-config: cliff.toml
          update-changelog: 'true'

  pages:
    name: Pages
    needs: [build-test-pack]
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build DocFX
        uses: GravionLabs/ci/pages/docfx@main
        with:
          solution: Horae.slnx

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

