name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Build, test, pack, verify and (on main) publish the NuGet package.
  # Versioning is handled internally by the reusable workflow via GitVersion.
  # The publish step only runs on refs/heads/main, so PRs build and test but never publish.
  package:
    name: Package
    permissions:
      contents: write
      packages: write
    uses: GravionLabs/ci/.github/workflows/nuget-package.yml@main
    with:
      dotnet-project: src/Horae/Horae.csproj
      gitversion-config-file: GitVersion.yml
      publish-feed-url: https://nuget.pkg.github.com/GravionLabs/index.json
      verify-package-files: |
        lib/net8.0/Horae.dll
        lib/net9.0/Horae.dll
        lib/net10.0/Horae.dll
        lib/net8.0/Horae.xml
        lib/net9.0/Horae.xml
        lib/net10.0/Horae.xml
        README.md
        CHANGELOG.md
    secrets:
      publish-api-key: ${{ secrets.GITHUB_TOKEN }}
